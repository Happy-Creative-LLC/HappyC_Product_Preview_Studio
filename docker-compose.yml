version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: productpreview_db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: productpreview
    ports:
      - "5432:5432"
    volumes:
      # Schema do Flyway tạo khi backend khởi động (backend/src/main/resources/db/migration).
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
