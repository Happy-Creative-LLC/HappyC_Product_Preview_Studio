spring:
  datasource:
    url: jdbc:h2:mem:productpreview;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

jwt:
  # Giá trị giả chỉ dùng cho test (HS512 cần tối thiểu 64 byte).
  secret: test-only-jwt-secret-not-for-real-use-0123456789-abcdefghijklmnopqrstuvwxyz
