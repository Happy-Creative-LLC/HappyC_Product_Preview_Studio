spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productpreview}
    username: ${DB_USER:dev}
    password: ${DB_PASS:dev123}
  flyway:
    # Schema do Flyway quản lý (db/migration). DB dev đã có sẵn dữ liệu được baseline ở V1,
    # nên V1 chỉ chạy trên DB trống; các migration sau V1 luôn được áp dụng.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Hibernate chỉ kiểm tra entity khớp schema, không tự sửa schema nữa.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # Không có giá trị mặc định: thiếu JWT_SECRET thì JwtTokenProvider từ chối khởi động.
  secret: ${JWT_SECRET:}
  expiration: 86400000 # 24 hours

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

server:
  port: 8081
  address: ${SERVER_ADDRESS:0.0.0.0}

app:
  base-url: ${APP_BASE_URL:}
  content:
    amazon-product-types:
      - SHIRT
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  search-cache:
    # Free: chỉ tìm mới/cập nhật khi người dùng yêu cầu, cache cũ vẫn đọc được.
    max-age-days: ${SEARCH_CACHE_MAX_AGE_DAYS:15}
    min-refresh-minutes: ${SEARCH_CACHE_MIN_REFRESH_MINUTES:60}
    refresh-enabled: ${SEARCH_CACHE_REFRESH_ENABLED:false}
  storage:
    # db    = lưu media vào Postgres (bảng stored_files) — mặc định giai đoạn test,
    #         data demo đi theo volume Docker / pg_dump thay vì backend/uploads/
    # r2    = Cloudflare R2 — dùng cho production (STORAGE_PROVIDER=r2), DB khởi động rỗng
    # local = ghi xuống đĩa backend/uploads/
    provider: ${STORAGE_PROVIDER:db}
    key-prefix: ${STORAGE_KEY_PREFIX:product-previews}
    local:
      directory: ${LOCAL_STORAGE_DIRECTORY:uploads}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}



serpapi:
  api-key: ${SERPAPI_API_KEY:}
  # Giữ true trong giai đoạn Free: kiểm tra gói $0 và lượt miễn phí còn lại.
  free-only: ${SERPAPI_FREE_ONLY:true}

# RestTemplate có thể ghi URI chứa api_key ở DEBUG; luôn tắt log request chi tiết.
logging:
  level:
    org.springframework.web.client.RestTemplate: WARN
    org.springframework.web.HttpLogging: WARN
