spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/productpreview
    username: ${DB_USER:dev}
    password: ${DB_PASS:dev123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:verySecretKeyForProductPreview1234567890qwertyuiopasdfghjklZXCVBNM123}
  expiration: 86400000 # 24 hours

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

server:
  port: 8081
  address: ${SERVER_ADDRESS:0.0.0.0}

app:
  base-url: ${APP_BASE_URL:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    key-prefix: ${STORAGE_KEY_PREFIX:product-previews}
    local:
      directory: ${LOCAL_STORAGE_DIRECTORY:uploads}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}



