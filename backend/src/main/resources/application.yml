spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/productpreview
    username: ${DB_USER:dev}
    password: ${DB_PASS:dev123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # Không có giá trị mặc định: thiếu JWT_SECRET thì JwtTokenProvider từ chối khởi động.
  secret: ${JWT_SECRET:}
  expiration: 86400000 # 24 hours

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

server:
  port: 8081
  address: ${SERVER_ADDRESS:0.0.0.0}

app:
  base-url: ${APP_BASE_URL:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  search-cache:
    # Amazon Search luôn phục vụ từ cache ngay lập tức (không chờ RapidAPI theo lượt
    # search); SearchCacheRefreshService làm mới nền vào Chủ nhật cho từ khoá đã quá
    # số ngày này, để không gián đoạn công việc của Seller.
    max-age-days: ${SEARCH_CACHE_MAX_AGE_DAYS:15}
  storage:
    # db    = lưu media vào Postgres (bảng stored_files) — mặc định giai đoạn test,
    #         data demo đi theo volume Docker / pg_dump thay vì backend/uploads/
    # r2    = Cloudflare R2 — dùng cho production (STORAGE_PROVIDER=r2), DB khởi động rỗng
    # local = ghi xuống đĩa backend/uploads/
    provider: ${STORAGE_PROVIDER:db}
    key-prefix: ${STORAGE_KEY_PREFIX:product-previews}
    local:
      directory: ${LOCAL_STORAGE_DIRECTORY:uploads}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}



# "Real-Time Amazon Data" (letscrape, RapidAPI) — verify bằng curl trước khi đổi
# sang sản phẩm khác, response schema khác nhà cung cấp không tương thích nhau.
# Không đặt default: thiếu cấu hình phải fail rõ ràng thay vì âm thầm gọi nhầm host.
rapidapi:
  amazon:
    host: ${RAPIDAPI_AMAZON_HOST:}
    key: ${RAPIDAPI_AMAZON_KEY:}
