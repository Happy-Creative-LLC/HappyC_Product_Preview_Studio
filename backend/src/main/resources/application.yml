spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/productpreview
    username: ${DB_USER:dev}
    password: ${DB_PASS:dev123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:verySecretKeyForProductPreview1234567890qwertyuiopasdfghjkl}
  expiration: 86400000 # 24 hours

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

server:
  port: 8080
